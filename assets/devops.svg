<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d11" />
    </linearGradient>

    <!-- Loop Azure Gradient -->
    <linearGradient id="azure-loop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0089D6" />
      <stop offset="50%" stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#3FA4F6" />
    </linearGradient>

    <!-- Loop Emerald Gradient -->
    <linearGradient id="emerald-loop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="50%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .infinity-flow {
      stroke-dasharray: 12, 12;
      animation: infinity-dash 18s linear infinite;
    }
    .shield-pulse {
      animation: shield-glow 3s infinite ease-in-out;
    }
    .stage-dot {
      animation: dot-pulse 2s infinite ease-in-out alternate;
    }

    @keyframes infinity-dash {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes shield-glow {
      0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 4px #0089D6); }
      50% { opacity: 1; filter: drop-shadow(0 0 16px #58A6FF); }
    }
    @keyframes dot-pulse {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.3); opacity: 1; }
    }
  </style>

  <!-- Container Rect -->
  <rect width="800" height="400" rx="12" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1" />
  <rect width="800" height="400" rx="12" fill="url(#grid-pattern)" />

  <!-- Header Banner -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#3fb950" />
    <text x="26" y="18" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#f0f6fc">CONTINUOUS DEVSECOPS PIPELINE</text>
  </g>

  <!-- Underlying Guide Path for Infinity Loop -->
  <!-- Left Center: (250, 200), Right Center: (550, 200) -->
  <path id="infinity-path" d="
    M 400 200 
    C 470 120, 620 120, 620 200 
    C 620 280, 470 280, 400 200 
    C 330 120, 180 120, 180 200 
    C 180 280, 330 280, 400 200 Z" 
    fill="none" stroke="#21262d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <path d="
    M 400 200 
    C 470 120, 620 120, 620 200 
    C 620 280, 470 280, 400 200 
    C 330 120, 180 120, 180 200 
    C 180 280, 330 280, 400 200 Z" 
    fill="none" stroke="#30363d" stroke-width="3" />

  <!-- Animated Active Flow Loop -->
  <path d="
    M 400 200 
    C 470 120, 620 120, 620 200 
    C 620 280, 470 280, 400 200 
    C 330 120, 180 120, 180 200 
    C 180 280, 330 280, 400 200 Z" 
    fill="none" stroke="url(#azure-loop)" stroke-width="4" stroke-linecap="round" class="infinity-flow" />

  <!-- Central DevSecOps Security Shield Node -->
  <g transform="translate(400, 200)" class="shield-pulse">
    <circle cx="0" cy="0" r="32" fill="#161b22" stroke="#0089D6" stroke-width="2" filter="url(#glow)" />
    <!-- Security Lock / Shield Vector -->
    <path d="M 0 -14 L 12 -8 L 12 4 C 12 11 0 16 0 16 C 0 16 -12 11 -12 4 L -12 -8 Z" fill="none" stroke="#58a6ff" stroke-width="2.5" />
    <path d="M -4 1 L 4 1 M 0 -3 L 0 5" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Left Loop Pipeline Stages (PLAN, CODE, BUILD, TEST) -->
  <!-- PLAN Stage -->
  <g transform="translate(220, 130)">
    <rect x="-40" y="-14" width="80" height="28" rx="8" fill="#161b22" stroke="#0089D6" stroke-width="1" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#58a6ff" text-anchor="middle">1. PLAN</text>
  </g>

  <!-- CODE Stage -->
  <g transform="translate(130, 200)">
    <rect x="-40" y="-14" width="80" height="28" rx="8" fill="#161b22" stroke="#844FBA" stroke-width="1" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#bc8cff" text-anchor="middle">2. CODE</text>
  </g>

  <!-- BUILD Stage -->
  <g transform="translate(220, 270)">
    <rect x="-40" y="-14" width="80" height="28" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#3fb950" text-anchor="middle">3. BUILD</text>
  </g>

  <!-- TEST / SCAN Stage -->
  <g transform="translate(320, 240)">
    <rect x="-45" y="-14" width="90" height="28" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f0883e" text-anchor="middle">4. SEC-SCAN</text>
  </g>

  <!-- Right Loop Pipeline Stages (RELEASE, DEPLOY, OPERATE, MONITOR) -->
  <!-- RELEASE Stage -->
  <g transform="translate(480, 160)">
    <rect x="-45" y="-14" width="90" height="28" rx="8" fill="#161b22" stroke="#0089D6" stroke-width="1" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#58a6ff" text-anchor="middle">5. RELEASE</text>
  </g>

  <!-- DEPLOY Stage -->
  <g transform="translate(580, 130)">
    <rect x="-45" y="-14" width="90" height="28" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#3fb950" text-anchor="middle">6. DEPLOY</text>
  </g>

  <!-- OPERATE Stage -->
  <g transform="translate(670, 200)">
    <rect x="-45" y="-14" width="90" height="28" rx="8" fill="#161b22" stroke="#844FBA" stroke-width="1" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#bc8cff" text-anchor="middle">7. OPERATE</text>
  </g>

  <!-- AI MONITOR Stage -->
  <g transform="translate(580, 270)">
    <rect x="-50" y="-14" width="100" height="28" rx="8" fill="#161b22" stroke="#33b3ae" stroke-width="1" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#39c5bb" text-anchor="middle">8. AI-MONITOR</text>
  </g>

  <!-- Bottom Stage Legend Pill -->
  <g transform="translate(400, 355)">
    <rect x="-220" y="-15" width="440" height="30" rx="15" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="0" y="4" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#8b949e" text-anchor="middle">
      <tspan fill="#58a6ff" font-weight="700">OIDC Auth</tspan> &bull; 
      <tspan fill="#3fb950" font-weight="700">Checkov IaC Scan</tspan> &bull; 
      <tspan fill="#bc8cff" font-weight="700">Terraform Plan</tspan> &bull; 
      <tspan fill="#f0883e" font-weight="700">Gemini SRE</tspan>
    </text>
  </g>
</svg>
