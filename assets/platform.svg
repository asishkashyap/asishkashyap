<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <linearGradient id="azure-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0089D6" />
      <stop offset="100%" stop-color="#58A6FF" />
    </linearGradient>

    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#844FBA" />
      <stop offset="100%" stop-color="#bc8cff" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="dot-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#30363d" />
    </pattern>
  </defs>

  <style>
    .node-pulse { animation: pulse-ring 3s infinite ease-out; }
    .data-stream { stroke-dasharray: 6, 8; animation: stream 15s linear infinite; }
    .data-stream-rev { stroke-dasharray: 6, 8; animation: stream-rev 12s linear infinite; }

    @keyframes pulse-ring {
      0% { r: 40px; opacity: 0.8; stroke-width: 2px; }
      100% { r: 75px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes stream { to { stroke-dashoffset: -300; } }
    @keyframes stream-rev { to { stroke-dashoffset: 300; } }
  </style>

  <!-- Container Box -->
  <rect width="800" height="400" rx="12" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1" />
  <rect width="800" height="400" rx="12" fill="url(#dot-grid)" opacity="0.6" />

  <!-- Top Header Label -->
  <rect x="24" y="20" width="280" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <circle cx="38" cy="34" r="4" fill="#0089D6" />
  <text x="50" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#f0f6fc">ZERO-TRUST PLATFORM ARCHITECTURE</text>

  <!-- Inter-Node Network Vector Lines -->
  <g stroke="#30363d" stroke-width="1.5" fill="none">
    <path d="M 150 200 L 400 200" />
    <path d="M 400 200 L 650 110" />
    <path d="M 400 200 L 650 290" />
    <path d="M 150 200 L 260 90 L 400 200" />
    <path d="M 150 200 L 260 310 L 400 200" />
  </g>

  <!-- Animated Active Data Flow Lines -->
  <path d="M 150 200 L 400 200" stroke="url(#azure-blue)" stroke-width="2.5" fill="none" class="data-stream" />
  <path d="M 400 200 L 650 110" stroke="url(#emerald)" stroke-width="2" fill="none" class="data-stream" />
  <path d="M 400 200 L 650 290" stroke="url(#purple)" stroke-width="2" fill="none" class="data-stream-rev" />

  <!-- Central Control Plane Node (Kubernetes / AKS) -->
  <g transform="translate(400, 200)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#0089D6" class="node-pulse" />
    <rect x="-45" y="-45" width="90" height="90" rx="20" fill="#161b22" stroke="#0089D6" stroke-width="2" filter="url(#glow)" />
    <!-- Kubernetes Wheel Vector -->
    <path d="M 0 -22 L 19 -11 L 19 11 L 0 22 L -19 11 L -19 -11 Z" fill="none" stroke="#58a6ff" stroke-width="2.5" />
    <circle cx="0" cy="0" r="6" fill="#3fb950" />
    <text x="0" y="60" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f0f6fc" text-anchor="middle">Kubernetes IDP</text>
    <text x="0" y="76" font-family="'Inter', sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Control Plane &amp; Mesh</text>
  </g>

  <!-- Left Node: Terraform IaC & GitOps -->
  <g transform="translate(150, 200)">
    <rect x="-35" y="-35" width="70" height="70" rx="16" fill="#161b22" stroke="#844FBA" stroke-width="2" />
    <path d="M -12 -15 L 0 -22 L 12 -15 L 12 15 L 0 22 L -12 15 Z" fill="none" stroke="#bc8cff" stroke-width="2" />
    <text x="0" y="52" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#bc8cff" text-anchor="middle">Terraform IaC</text>
    <text x="0" y="66" font-family="'Inter', sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Immutable Modules</text>
  </g>

  <!-- Top-Mid Node: Azure OIDC Auth -->
  <g transform="translate(260, 90)">
    <rect x="-28" y="-28" width="56" height="56" rx="14" fill="#161b22" stroke="#0089D6" stroke-width="1.5" />
    <!-- Shield Icon -->
    <path d="M 0 -12 L 10 -7 L 10 3 C 10 9 0 14 0 14 C 0 14 -10 9 -10 3 L -10 -7 Z" fill="none" stroke="#58a6ff" stroke-width="2" />
    <text x="0" y="42" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#58a6ff" text-anchor="middle">Azure OIDC</text>
  </g>

  <!-- Bottom-Mid Node: DevSecOps Policy -->
  <g transform="translate(260, 310)">
    <rect x="-28" y="-28" width="56" height="56" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="1.5" />
    <!-- Checkmark / Policy Icon -->
    <path d="M -8 -2 L -2 4 L 8 -6" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="42" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#3fb950" text-anchor="middle">Checkov Scan</text>
  </g>

  <!-- Top Right Node: Autonomous AI SRE -->
  <g transform="translate(650, 110)">
    <rect x="-35" y="-35" width="70" height="70" rx="16" fill="#161b22" stroke="#3fb950" stroke-width="2" />
    <!-- AI Brain Sparkle -->
    <path d="M 0 -15 L 4 -4 L 15 0 L 4 4 L 0 15 L -4 4 L -15 0 L -4 -4 Z" fill="url(#emerald)" />
    <text x="0" y="52" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#3fb950" text-anchor="middle">AI SRE Bot</text>
    <text x="0" y="66" font-family="'Inter', sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Gemini Log Parser</text>
  </g>

  <!-- Bottom Right Node: Multi-Region Microservices -->
  <g transform="translate(650, 290)">
    <rect x="-35" y="-35" width="70" height="70" rx="16" fill="#161b22" stroke="#f0883e" stroke-width="2" />
    <!-- Pod Containers -->
    <rect x="-16" y="-16" width="14" height="14" rx="3" fill="#f0883e" opacity="0.8" />
    <rect x="2" y="-16" width="14" height="14" rx="3" fill="#58a6ff" opacity="0.8" />
    <rect x="-16" y="2" width="14" height="14" rx="3" fill="#3fb950" opacity="0.8" />
    <rect x="2" y="2" width="14" height="14" rx="3" fill="#bc8cff" opacity="0.8" />
    <text x="0" y="52" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f0883e" text-anchor="middle">EKS / AKS Pods</text>
    <text x="0" y="66" font-family="'Inter', sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Zero-Trust Network</text>
  </g>
</svg>
