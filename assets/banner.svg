<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d11" />
    </linearGradient>

    <!-- Accent Azure Gradient -->
    <linearGradient id="azure-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0089D6" />
      <stop offset="50%" stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#3FA4F6" />
    </linearGradient>

    <!-- Emerald Security Gradient -->
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#58a6ff" fill-opacity="0.2" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 900;
      font-size: 54px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.5px;
      fill: #58a6ff;
    }
    .desc-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 17px;
      fill: #8b949e;
    }
    .pulse-node {
      animation: pulse 3s infinite ease-in-out;
    }
    .pulse-delay-1 {
      animation: pulse 3s infinite ease-in-out 1s;
    }
    .pulse-delay-2 {
      animation: pulse 3s infinite ease-in-out 2s;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dash 20s linear infinite;
    }
    .orbit-circle {
      animation: rotate 25s linear infinite;
      transform-origin: 1020px 150px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.3); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="300" rx="12" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1" />
  <rect width="1200" height="300" rx="12" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="120" fill="#0089D6" fill-opacity="0.08" filter="url(#soft-glow)" />
  <circle cx="1020" cy="150" r="140" fill="#58A6FF" fill-opacity="0.1" filter="url(#soft-glow)" />
  <circle cx="600" cy="220" r="100" fill="#2ea043" fill-opacity="0.06" filter="url(#soft-glow)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#azure-grad)" />

  <!-- Circuit / Pipeline Connecting Vector Paths -->
  <g stroke="#30363d" stroke-width="1.5" fill="none">
    <path d="M 50 220 L 220 220 L 280 160 L 450 160" />
    <path d="M 120 50 L 250 50 L 320 110 L 500 110" />
    <path d="M 750 240 L 880 240 L 940 180 L 1150 180" />
  </g>

  <!-- Animated Active Flow Line -->
  <path d="M 50 220 L 220 220 L 280 160 L 450 160" stroke="url(#azure-grad)" stroke-width="2" fill="none" class="flow-line" />
  <path d="M 750 240 L 880 240 L 940 180 L 1150 180" stroke="url(#emerald-grad)" stroke-width="2" fill="none" class="flow-line" />

  <!-- Decorative Orbit Vector graphic on Right Side -->
  <g class="orbit-circle" stroke="#58a6ff" stroke-opacity="0.25" fill="none">
    <circle cx="1020" cy="150" r="80" stroke-width="1" stroke-dasharray="4, 6" />
    <circle cx="1020" cy="150" r="110" stroke-width="1.5" stroke-dasharray="12, 8" />
    <circle cx="1100" cy="150" r="6" fill="#0089D6" />
    <circle cx="940" cy="150" r="5" fill="#3fb950" />
    <circle cx="1020" cy="40" r="7" fill="#a371f7" />
  </g>

  <g transform="translate(1020, 150)">
    <!-- Central Kubernetes / Cloud Icon Node -->
    <rect x="-35" y="-35" width="70" height="70" rx="16" fill="#161b22" stroke="#58a6ff" stroke-width="2" filter="url(#glow)" />
    <!-- Helm / K8s Wheel Vector -->
    <path d="M 0 -18 L 16 -8 L 16 12 L 0 20 L -16 12 L -16 -8 Z" fill="none" stroke="#58a6ff" stroke-width="2" />
    <circle cx="0" cy="1" r="5" fill="#3fb950" />
  </g>

  <!-- Hero Text Block Left Aligned -->
  <g transform="translate(60, 42)">
    <!-- Terminal Tag Pill -->
    <rect x="0" y="0" width="240" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#3fb950" class="pulse-node" />
    <text x="32" y="21" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#8b949e">DEVSECOPS &amp; AI SRE</text>

    <!-- Main Title -->
    <text x="0" y="86" class="title-text" fill="#f0f6fc">ASISH KASHYAP</text>
    
    <!-- Subtitle -->
    <text x="0" y="122" class="subtitle-text">Senior DevSecOps &amp; AI Systems Engineer</text>

    <!-- Description -->
    <text x="0" y="156" class="desc-text">Zero-Trust Kubernetes Control Planes &#8226; Azure OIDC &#8226; Terraform IaC &#8226; Autonomous AI Agents</text>

    <!-- Tech Badges Bar -->
    <g transform="translate(0, 182)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="165" height="42" rx="10" fill="#161b22" stroke="#0089D6" stroke-width="1.5" />
      <text x="82.5" y="26" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#58a6ff" text-anchor="middle">Kubernetes</text>

      <!-- Badge 2 -->
      <rect x="181" y="0" width="185" height="42" rx="10" fill="#161b22" stroke="#844FBA" stroke-width="1.5" />
      <text x="273.5" y="26" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#bc8cff" text-anchor="middle">Terraform IaC</text>

      <!-- Badge 3 -->
      <rect x="382" y="0" width="155" height="42" rx="10" fill="#161b22" stroke="#2ea043" stroke-width="1.5" />
      <text x="459.5" y="26" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#3fb950" text-anchor="middle">DevSecOps</text>

      <!-- Badge 4 -->
      <rect x="553" y="0" width="185" height="42" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="1.5" />
      <text x="645.5" y="26" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#f0883e" text-anchor="middle">AI SRE Agents</text>
    </g>
  </g>

  <!-- Interactive Pulse Dots -->
  <circle cx="280" cy="160" r="4" fill="#58a6ff" class="pulse-node" />
  <circle cx="450" cy="160" r="4" fill="#0089D6" class="pulse-delay-1" />
  <circle cx="940" cy="180" r="4" fill="#3fb950" class="pulse-delay-2" />
</svg>
