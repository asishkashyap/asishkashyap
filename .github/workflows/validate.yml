name: Asset & Link Integrity CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate SVG assets
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const assetsDir = "./assets";
            if (!fs.existsSync(assetsDir)) process.exit(0);
            const files = fs.readdirSync(assetsDir).filter(f => f.endsWith(".svg"));
            console.log("Validating", files.length, "SVG assets...");
            for (const f of files) {
              const content = fs.readFileSync(path.join(assetsDir, f), "utf8");
              if (!content.includes("<svg")) throw new Error("Invalid SVG file: " + f);
            }
            console.log("All SVG assets valid!");
          '
